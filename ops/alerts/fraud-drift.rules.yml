groups:
  - name: fraud_drift_alerts
    rules:
      # PSI critical (>= 0.2) sustained for 10m
      - alert: FraudDriftPSICritical
        expr: |
          max_over_time(fraud_drift_psi[10m]) >= 0.2
        for: 10m
        labels:
          severity: page
          team: fraud
          pager: primary
          runbook: "https://runbooks.chronopay.local/fraud/drift-detector"
        annotations:
          summary: "Fraud score drift PSI critical for {{ $labels.model_version }}"
          description: |
            fraud_drift_psi for model {{ $labels.model_version }} breached the
            critical PSI threshold (>= 0.2) over a 10-minute window. The live
            fraud score distribution has diverged significantly from the
            training baseline. Investigate recent fraud rule changes, scoring
            regressions, or upstream traffic composition shifts.
          runbook_url: "https://runbooks.chronopay.local/fraud/drift-detector"
          dashboard_url: "https://grafana.chronopay.local/d/fraud-drift"

      # PSI warning (>= 0.1) sustained for 30m
      - alert: FraudDriftPSIWarning
        expr: |
          max_over_time(fraud_drift_psi[30m]) >= 0.1
        for: 30m
        labels:
          severity: ticket
          team: fraud
        annotations:
          summary: "Fraud score drift PSI warning for {{ $labels.model_version }}"
          description: |
            fraud_drift_psi for model {{ $labels.model_version }} crossed the
            warning PSI threshold (>= 0.1) for at least 30 minutes. No page
            required but please triage within business hours.
          runbook_url: "https://runbooks.chronopay.local/fraud/drift-detector"
          dashboard_url: "https://grafana.chronopay.local/d/fraud-drift"

      # KL divergence critical (>= 0.1) sustained for 10m
      - alert: FraudDriftKLCritical
        expr: |
          max_over_time(fraud_drift_kl[10m]) >= 0.1
        for: 10m
        labels:
          severity: page
          team: fraud
          pager: primary
          runbook: "https://runbooks.chronopay.local/fraud/drift-detector"
        annotations:
          summary: "Fraud score drift KL critical for {{ $labels.model_version }}"
          description: |
            fraud_drift_kl for model {{ $labels.model_version }} is above the
            critical KL threshold (>= 0.1) over a 10m window, indicating the
            live histogram materially differs from training.
          runbook_url: "https://runbooks.chronopay.local/fraud/drift-detector"
          dashboard_url: "https://grafana.chronopay.local/d/fraud-drift"

      # KL divergence warning (>= 0.05) sustained for 30m
      - alert: FraudDriftKLWarning
        expr: |
          max_over_time(fraud_drift_kl[30m]) >= 0.05
        for: 30m
        labels:
          severity: ticket
          team: fraud
        annotations:
          summary: "Fraud score drift KL warning for {{ $labels.model_version }}"
          description: |
            fraud_drift_kl for model {{ $labels.model_version }} crossed the
            warning KL threshold (>= 0.05) for at least 30 minutes.
          runbook_url: "https://runbooks.chronopay.local/fraud/drift-detector"
          dashboard_url: "https://grafana.chronopay.local/d/fraud-drift"

      # "no baseline" status (status gauge == 3) means a new model version
      # was deployed without re-establishing the baseline. This is almost
      # always an operational gap and warrants a ticket.
      - alert: FraudDriftMissingBaseline
        expr: |
          fraud_drift_status{model_version=~".+"} == 3
        for: 15m
        labels:
          severity: ticket
          team: fraud
        annotations:
          summary: "Fraud drift detection is missing a baseline for {{ $labels.model_version }}"
          description: |
            fraud_drift_status for {{ $labels.model_version }} == 3 (no baseline)
            for at least 15 minutes. The most likely causes are:
              - a new model version was deployed without re-publishing the
                training histogram, or
              - the existing baseline was explicitly cleared without replacement.
            Re-run the training distribution import or confirm the deployment
            pipeline is feeding baseline metrics.
          runbook_url: "https://runbooks.chronopay.local/fraud/drift-detector"
          dashboard_url: "https://grafana.chronopay.local/d/fraud-drift"

      # Cardinality safety net: ensure the metric is not silently overflowing
      # (model_version label budget is 8).
      - alert: FraudDriftMetricCardinalityOverflow
        expr: |
          rate(metric_cardinality_overflow_total{metric=~"fraud_drift_.+"}[10m]) > 0
        for: 30m
        labels:
          severity: ticket
          team: observability
        annotations:
          summary: "Fraud drift metric exceeded its label budget"
          description: |
            fraud_drift_* metrics are relabeling observations to __overflow__
            because the model_version label budget (8) was exceeded. New label
            values are not propagating. Confirm model version count and rotate
            the version budget if intentional.
