name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Lint Prometheus Rules
        run: docker run --rm --entrypoint sh -v ${{ github.workspace }}:/workspace prom/prometheus -c 'promtool check rules /workspace/ops/alerts/*.yml'
      - name: Validate Grafana Dashboards
        run: npx tsx scripts/validate-dashboards.ts

  deploy-pr-guard:
    name: Production deploy PR guard
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ID != '' && vars.PR_NUMBER != '' && vars.REPO != '' && vars.SHA != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify deploy references a merged PR
        env:
          DEPLOY_ID: ${{ vars.DEPLOY_ID }}
          PR_NUMBER: ${{ vars.PR_NUMBER }}
          REPO: ${{ vars.REPO }}
          SHA: ${{ vars.SHA }}
          MANUAL_OVERRIDE: ${{ vars.MANUAL_OVERRIDE || 'false' }}
        run: npm run deploy:pr-check

  test-shards:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/testdb
      POSTGRESQL_URL: postgres://test:test@localhost:5432/testdb
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on PRs so git diff can compute the merge-base.
          # Pushes to main always run the full suite so depth=1 is fine.
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        if: github.event_name != 'pull_request'
        run: npm run build

      - name: PII conformance scan
        if: github.event_name != 'pull_request'
        run: npm run pii-scan
        # Fails the build (exit 1) if any unredacted PII pattern is found in
        # build artefacts under dist/ or logs/.  See docs/pii-conformance.md.

      - name: Validate migrations
        run: npm run migrate validate

      - name: Run migrations
        run: npm run migrate up

      # ------------------------------------------------------------------
      # Determine changed files (PR only). On pushes to main this step is
      # skipped and the full suite always runs.
      # ------------------------------------------------------------------
      - name: Get changed files
        id: changed_files
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD \
            > /tmp/changed_files.txt
          echo "Changed files:"
          cat /tmp/changed_files.txt

      - name: Select tests for changed files
        id: select_tests
        if: github.event_name == 'pull_request'
        run: |
          mapfile -t changed < /tmp/changed_files.txt
          npx tsx scripts/select-tests.ts \
            --changed-files "${changed[@]}" \
            --graph scripts/test-graph.json \
            --output /tmp/selected-tests.txt \
            --verbose
          echo "Selected tests:"
          cat /tmp/selected-tests.txt

      # ------------------------------------------------------------------
      # Run tests.
      #   main / push : always full suite.
      #   PR          : selected subset, or full suite on fallback.
      # ------------------------------------------------------------------
      - name: Run tests (full — main)
        if: github.event_name != 'pull_request'
        run: npm test

      - name: Run tests (selected — PR)
        if: github.event_name == 'pull_request'
        run: |
          SELECTION=$(cat /tmp/selected-tests.txt)
          if [ "$SELECTION" = "__full_run__" ]; then
            echo "Graph triggered full run."
            npm test
          else
            echo "Running selected tests:"
            cat /tmp/selected-tests.txt
            mapfile -t TEST_PATHS < /tmp/selected-tests.txt
            PATTERN=$(IFS='|'; echo "${TEST_PATHS[*]}")
            npm test -- --testPathPattern="$PATTERN"
          fi

  openapi-breaking-check:
    name: OpenAPI Breaking‑Change Check
    runs-on: ubuntu-latest
    needs: [lint, test-shards]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install oasdiff
        run: npm i -D openapi-diff@0.24.1
      - name: Generate spec for base (main)
        run: |
          git fetch origin main
          git checkout origin/main
          npm run generate-openapi > base-openapi.json || echo "failed" > base-openapi.json
      - name: Generate spec for head (PR)
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          npm run generate-openapi > head-openapi.json || echo "failed" > head-openapi.json
      - name: Run diff
        id: diff
        run: |
          set -e
          if npx openapi-diff break base-openapi.json head-openapi.json > diff.txt; then
            echo "breaking=no" >> $GITHUB_OUTPUT
          else
            echo "breaking=yes" >> $GITHUB_OUTPUT
          fi
      - name: Fail on breaking changes without label
        if: steps.diff.outputs.breaking == 'yes' && !contains(github.event.pull_request.labels.*.name, 'breaking-change-approved')
        run: |
          echo "Breaking changes detected without approved label."
          cat diff.txt
          exit 1
      - name: Comment diff on PR
        if: always()
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## OpenAPI Breaking‑Check

            \`\`\`
            $(cat diff.txt)
            \`\`\`
            ${{ steps.diff.outputs.breaking == 'yes' && '⚠️ Breaking changes detected. Add `breaking-change-approved` label to override.' || '✅ No breaking changes.' }}

  sdk-release:
    name: Publish SDK to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [lint, test-shards]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Publish SDK
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release-sdk.js --tag "${GITHUB_REF_NAME}"

  container-scan:
    name: Container Image Security Scan
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Build Docker image
        run: docker build -t app:${{ github.sha }} .
      - name: Run Trivy scan (high/critical)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --format json -o trivy-report.json app:${{ github.sha }}
      - name: Generate application SBOM (CycloneDX)
        run: npm run sbom -- --output sbom.app.cyclonedx.json
      - name: Generate container SBOM (CycloneDX, includes OS packages)
        run: trivy image --format cyclonedx -o sbom.container.cyclonedx.json app:${{ github.sha }}
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
      - name: Upload SBOMs (workflow artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.app.cyclonedx.json
            sbom.container.cyclonedx.json
      - name: Upload SBOMs to supply-chain security portal
        continue-on-error: true
        env:
          SBOM_PORTAL_URL: ${{ secrets.SBOM_PORTAL_URL }}
          SBOM_PORTAL_API_KEY: ${{ secrets.SBOM_PORTAL_API_KEY }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          npm run sbom:upload -- --file sbom.app.cyclonedx.json
          npm run sbom:upload -- --file sbom.container.cyclonedx.json
      - name: Attach SBOMs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.app.cyclonedx.json
            sbom.container.cyclonedx.json
