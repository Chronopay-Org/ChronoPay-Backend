# Local development override for Docker Compose
# This file is automatically loaded by docker-compose when running 'docker-compose up'
# It overrides production settings for local development
#
# Dev-only credentials below are NOT production secrets.
# After first start, run migrations once:
#   docker compose run --rm api npm run migrate up

services:
  api:
    build:
      target: builder  # Use builder stage for dev (includes dev dependencies)
    container_name: chronopay-api-dev
    restart: "no"
    ports:
      - "${PORT:-3001}:3001"
      - "9229:9229"  # Node.js debug port
    environment:
      - NODE_ENV=development
      - PORT=${PORT:-3001}
      - DEBUG=*
      - DATABASE_URL=postgres://chronopay:chronopay@postgres:5432/chronopay
      - POSTGRESQL_URL=postgres://chronopay:chronopay@postgres:5432/chronopay
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-only-insecure-jwt-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source code for hot reload during development
      - ./src:/app/src:ro
      # Mount package.json for dependency updates
      - ./package.json:/app/package.json:ro
      # Exclude node_modules from volume mount
      - /app/node_modules
      # Exclude dist to use container's built version
      - /app/dist
    command: ["npx", "tsx", "watch", "--inspect=0.0.0.0:9229", "src/index.ts"]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Remove production security restrictions for development
    security_opt: []
    read_only: false
    tmpfs: []
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    # Development labels
    labels:
      - "com.chronopay.service=api"
      - "com.chronopay.environment=development"

  postgres:
    image: postgres:16-alpine
    container_name: chronopay-postgres-dev
    restart: "no"
    environment:
      - POSTGRES_USER=chronopay
      - POSTGRES_PASSWORD=chronopay
      - POSTGRES_DB=chronopay
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronopay -d chronopay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    labels:
      - "com.chronopay.service=postgres"
      - "com.chronopay.environment=development"

  redis:
    image: redis:7-alpine
    container_name: chronopay-redis-dev
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    labels:
      - "com.chronopay.service=redis"
      - "com.chronopay.environment=development"

volumes:
  postgres-data:
  redis-data:
